<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>HVL-MCK — 30 bài hát</title>
    <meta name="theme-color" content="#07070a" />
    <meta
      name="description"
      content="Trình nghe nhạc offline cho bộ sưu tập 30 bài hát MCK"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <div id="app">
      <header class="topbar">
        <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="Về trang chủ">
          <span class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          </span>
          <span class="brand-name">HVL-<em>MCK</em></span>
        </div>
        <div class="search">
          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input
            id="search-input"
            type="search"
            placeholder="Tìm bài hát..."
            autocomplete="off"
          />
        </div>
        <div class="topbar-meta">
          <span id="song-count">30 bài hát</span>
          <span class="topbar-avatar" aria-hidden="true"><img src="images/logo.jpg" alt="HVL-MCK" /></span>
        </div>
      </header>

      <div class="yt-body">
        <main class="main">
          <section id="view-home" class="view view-home">
            <div class="view-head">
              <h1 id="home-title" class="view-title">Trang chủ</h1>
              <div class="filter-group" id="filter-group">
                <button
                  type="button"
                  class="filter-pill active"
                  data-filter="all"
                >
                  Tất cả
                </button>
                <button type="button" class="filter-pill" data-filter="mv">
                  Có MV
                </button>
              </div>
            </div>
            <ul id="card-grid" class="card-grid"></ul>
            <p id="no-results" class="no-results" hidden>
              Không tìm thấy bài hát nào.
            </p>
          </section>

          <section id="view-watch" class="view view-watch" hidden>
            <div class="watch-cols">
              <div class="watch-player">
                <button
                  id="btn-back"
                  class="icon-btn"
                  aria-label="Quay lại trang chủ"
                >
                  <svg
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M15 18l-6-6 6-6" />
                  </svg>
                </button>
                <div class="watch-stage">
                  <div class="stage-visual" id="stage-visual">
                    <div class="stage-empty" id="stage-empty">
                    <svg
                      viewBox="0 0 24 24"
                      width="40"
                      height="40"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="12" r="9" />
                      <path d="M9 15V9l7-2v6" />
                    </svg>
                    <p>Chọn một bài hát để bắt đầu</p>
                  </div>
                  <video
                    id="audio-el"
                    class="audio-video"
                    playsinline
                    preload="metadata"
                    muted
                    hidden
                  ></video>
                  <video
                    id="mv-video"
                    class="mv-video"
                    playsinline
                    preload="metadata"
                    muted
                    hidden
                  ></video>
                  <!--
                    The real, always-audible sound source. audio-el/mv-video above are
                    muted decorative pictures only — see js/app.js for why.
                  -->
                  <audio id="sound-el" preload="metadata" hidden></audio>
                  <div class="stage-overlay">
                    <div class="progress-row">
                      <span id="time-current" class="time">0:00</span>
                      <input
                        id="progress"
                        class="progress"
                        type="range"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                        aria-label="Tiến trình bài hát"
                      />
                      <span id="time-duration" class="time">0:00</span>
                    </div>
                    <div class="controls-row">
                      <button
                        id="btn-shuffle"
                        class="ctrl-btn"
                        title="Phát ngẫu nhiên"
                        aria-label="Phát ngẫu nhiên"
                      >
                        <svg
                          viewBox="0 0 24 24"
                          width="20"
                          height="20"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="M3 7h4l10 10h4" />
                          <path d="M17 7h4v4" />
                          <path d="M3 17h4l2.5-2.5" />
                          <path d="m14.5 9.5 2.5-2.5h4" />
                        </svg>
                      </button>
                      <button
                        id="btn-prev"
                        class="ctrl-btn"
                        title="Bài trước"
                        aria-label="Bài trước"
                      >
                        <svg
                          viewBox="0 0 24 24"
                          width="22"
                          height="22"
                          fill="currentColor"
                        >
                          <path d="M6 5h2v14H6zM20 5v14l-11-7z" />
                        </svg>
                      </button>
                      <button
                        id="btn-play"
                        class="ctrl-btn play-btn"
                        title="Phát / Tạm dừng"
                        aria-label="Phát hoặc tạm dừng"
                      >
                        <svg
                          id="icon-play"
                          class="icon-play"
                          viewBox="0 0 24 24"
                          width="26"
                          height="26"
                          fill="currentColor"
                        >
                          <path d="M8 5.5v13l11-6.5-11-6.5z" />
                        </svg>
                        <svg
                          id="icon-pause"
                          class="icon-pause"
                          viewBox="0 0 24 24"
                          width="26"
                          height="26"
                          fill="currentColor"
                        >
                          <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
                        </svg>
                      </button>
                      <button
                        id="btn-next"
                        class="ctrl-btn"
                        title="Bài sau"
                        aria-label="Bài sau"
                      >
                        <svg
                          viewBox="0 0 24 24"
                          width="22"
                          height="22"
                          fill="currentColor"
                        >
                          <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
                        </svg>
                      </button>
                      <button
                        id="btn-repeat"
                        class="ctrl-btn"
                        title="Lặp lại"
                        aria-label="Lặp lại"
                      >
                        <svg
                          viewBox="0 0 24 24"
                          width="20"
                          height="20"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="m17 2 4 4-4 4" />
                          <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                          <path d="m7 22-4-4 4-4" />
                          <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                        </svg>
                        <span id="repeat-one-badge" class="repeat-one-badge">1</span>
                      </button>
                    </div>
                    <button
                      id="btn-fullscreen"
                      class="ctrl-btn fullscreen-btn"
                      title="Toàn màn hình"
                      aria-label="Xem toàn màn hình"
                    >
                      <svg
                        id="icon-fs-expand"
                        class="icon-fs-expand"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M8 3H5a2 2 0 0 0-2 2v3" />
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
                        <path d="M3 16v3a2 2 0 0 0 2 2h3" />
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
                      </svg>
                      <svg
                        id="icon-fs-collapse"
                        class="icon-fs-collapse"
                        viewBox="0 0 24 24"
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M8 3v3a2 2 0 0 1-2 2H3" />
                        <path d="M21 8h-3a2 2 0 0 1-2-2V3" />
                        <path d="M3 16h3a2 2 0 0 1 2 2v3" />
                        <path d="M16 21v-3a2 2 0 0 1 2-2h3" />
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="watch-top-info">
                  <div class="watch-top-text">
                    <h2 id="stage-title" class="stage-title">
                      Chưa phát bài nào
                    </h2>
                    <p id="stage-sub" class="stage-sub">MCK</p>
                  </div>
                  <div class="view-toggle" id="view-toggle">
                    <button
                      type="button"
                      class="view-btn active"
                      data-mode="image"
                    >
                      <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M9 18V5l12-2v13" />
                        <circle cx="6" cy="18" r="3" />
                        <circle cx="18" cy="16" r="3" />
                      </svg>
                      <span>Audio</span>
                    </button>
                    <button
                      type="button"
                      class="view-btn"
                      data-mode="mv"
                      id="mv-toggle-btn"
                      disabled
                    >
                      <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="currentColor"
                      >
                        <path d="M8 5.5v13l11-6.5-11-6.5z" />
                      </svg>
                      <span>MV</span>
                    </button>
                  </div>
                </div>
                </div>
              </div>
              <aside class="watch-list" aria-label="Danh sách phát">
                <h3 class="watch-list-title">Danh sách phát</h3>
                <ul id="song-list" class="song-list"></ul>
              </aside>
            </div>
          </section>
        </main>
      </div>

      <div class="player-bar" id="player-bar" hidden>
        <div class="pb-row">
          <img id="pb-cover" class="pb-cover" alt="" />
          <div class="pb-info">
            <div id="pb-title" class="pb-title">Chưa phát bài nào</div>
          </div>
          <div class="pb-controls">
            <button id="pb-prev" class="pb-btn" aria-label="Bài trước">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="currentColor"
              >
                <path d="M6 5h2v14H6zM20 5v14l-11-7z" />
              </svg>
            </button>
            <button
              id="pb-play"
              class="pb-btn pb-play"
              aria-label="Phát hoặc tạm dừng"
            >
              <svg
                class="icon-play"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="currentColor"
              >
                <path d="M8 5.5v13l11-6.5-11-6.5z" />
              </svg>
              <svg
                class="icon-pause"
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="currentColor"
              >
                <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
              </svg>
            </button>
            <button id="pb-next" class="pb-btn" aria-label="Bài sau">
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="currentColor"
              >
                <path d="M16 5h2v14h-2zM4 5v14l11-7z" />
              </svg>
            </button>
          </div>
        </div>
        <div class="pb-progress">
          <div id="pb-progress-fill" class="pb-progress-fill"></div>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/player.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
